[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "nju-coding-agent"
version = "0.1.0"
description = "A lightweight, self-contained coding agent harness with local development tools"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["openai>=1.65.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[project.scripts]
coding-agent = "coding_agent.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/coding_agent"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
